
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm your email</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f7; font-family: Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7; padding:30px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden;">
          <tr>
            <td style="background-color:#4f46e5; padding:24px; text-align:center;">
              <h1 style="color:#ffffff; margin:0; font-size:20px;">Confirm your email</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h2 style="color:#111827; font-size:18px; margin-top:0;">
                Hi {{ first_name }} {{ last_name }},
              </h2>
              <p style="color:#374151; font-size:15px; line-height:1.5;">
                Please confirm your email address by clicking the button below.
              </p>

              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:28px auto;">
                <tr>
                  <td align="center" style="border-radius:6px; background-color:#4f46e5;">
                    <a href="{{ front_base_url }}auth/activate_account?token={{ token }}"
                       target="_blank"
                       style="display:inline-block; padding:12px 28px; font-size:15px; color:#ffffff; text-decoration:none; font-weight:bold;">
                      Activate Account
                    </a>
                  </td>
                </tr>
              </table>

              <p style="color:#9ca3af; font-size:12px; margin-top:32px;">
                If you didn't create an account, you can safely ignore this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
